name: Wdrożenie
run-name: 🚀 Wdrożenie 🚀
on:
  pull_request:
    types:
    - synchronize
    - opened
    - closed
# The latest commit is the one that will be used to create the PR environment and deploy to production
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  checks:
    name: Sprawdzenie semantyki kodu
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Zmień gałęź
        uses: actions/checkout@v5
      - name: Zainstaluj pre-commit i uruchom sprawdzenie kodu
        uses: j178/prek-action@v1
  sqlmesh:
    name: Wdrożenie SQLMesh
    needs: checks
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_DATABASE: ${{ (github.head_ref || github.ref_name) == 'main' && 'SC_PROD' || (github.head_ref || github.ref_name) == 'test' && 'SC_TEST' || 'SC_DEV' }}
    permissions:
      # Required to access code in PR
      contents: write
      # Required to post comments
      issues: write
      # Required to update check runs
      checks: write
      # Required to merge
      pull-requests: write
    steps:
      - name: Zmień gałęź
        if: github.event.pull_request.merged == false
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number  }}/merge

      - name: Dodatkowe zmienne GitHub
        uses: rlespinasse/github-slug-action@v5
        with:
          slug-maxlength: 63

      - name: Zainstaluj uv (z mechanizmem cache)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Zainstaluj zależności
        run: uv sync --locked --all-extras --dev

      - name: 🧪 SQLMesh — Testy jednostkowe i integracyjne
        if: github.event.pull_request.merged == false
        working-directory: sqlmesh
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PR_ENVIRONMENT_NAME: ${{ github.event.pull_request.base.ref == 'dev' && env.GITHUB_HEAD_REF_SLUG || 'blue' }}
        run: |
          uv run sqlmesh_cicd github --token ${{ secrets.GITHUB_TOKEN }} run-tests

      - name: 🧱 SQLMesh — Zaktualizuj środowisko testowe
        if: github.event.pull_request.merged == false
        working-directory: sqlmesh
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PR_ENVIRONMENT_NAME: ${{ github.event.pull_request.base.ref == 'dev' && env.GITHUB_HEAD_REF_SLUG || 'blue' }}
        run: |
          uv run sqlmesh_cicd github --token ${{ secrets.GITHUB_TOKEN }} update-pr-environment

      # Production deploy as a separate named step on merge to main
      - name: 🚀 SQLMesh — Wdróż na środowisko produkcyjne
        if: github.event.pull_request.merged == true
        working-directory: sqlmesh
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          uv run sqlmesh_cicd github --token ${{ secrets.GITHUB_TOKEN }} deploy-production
