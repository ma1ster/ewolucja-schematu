test_payment_total:
  model: mart.payment_total
  description: "Validates calculate_payment_totals macro against a variety of order payment compositions: all-methods match, single-method match, mismatch case, rounding tolerance, and all-zeros."
  inputs:
    mart.orders:
      rows:
        # Przypadek testowy 1: Wszystkie metody płatności mają wartości, całkowita liczba dopasowań
        - order_id: 1
          customer_id: 1
          order_date: 2018-01-01
          status: completed
          credit_card_amount: 10.0
          coupon_amount: 5.0
          bank_transfer_amount: 3.0
          gift_card_amount: 2.0
          amount: 20.0

        # Przypadek testowy 2: Tylko płatność kartą kredytową, zgodność całkowita
        - order_id: 2
          customer_id: 2
          order_date: 2018-01-02
          status: completed
          credit_card_amount: 50.0
          coupon_amount: 0.0
          bank_transfer_amount: 0.0
          gift_card_amount: 0.0
          amount: 50.0

        # Przypadek testowy 3: Płatności mieszane, suma nie zgadza się (różnica większa niż 0,01)
        - order_id: 3
          customer_id: 3
          order_date: 2018-01-03
          status: completed
          credit_card_amount: 25.0
          coupon_amount: 10.0
          bank_transfer_amount: 0.0
          gift_card_amount: 5.0
          amount: 45.0

        # Przypadek testowy 4: Całkowita liczba dopasowań w granicach tolerancji 0,01 (test zaokrąglania)
        - order_id: 4
          customer_id: 4
          order_date: 2018-01-04
          status: completed
          credit_card_amount: 10.33
          coupon_amount: 10.33
          bank_transfer_amount: 10.33
          gift_card_amount: 0.0
          amount: 31.0

        # Przypadek testowy 5: Wszystkie zera
        - order_id: 5
          customer_id: 5
          order_date: 2018-01-05
          status: returned
          credit_card_amount: 0.0
          coupon_amount: 0.0
          bank_transfer_amount: 0.0
          gift_card_amount: 0.0
          amount: 0.0

  outputs:
    query:
      rows:
        - order_id: 1
          credit_card_amount: 10.0
          coupon_amount: 5.0
          bank_transfer_amount: 3.0
          gift_card_amount: 2.0
          amount: 20.0
          calculated_total: 20.0
          amounts_match: true

        - order_id: 2
          credit_card_amount: 50.0
          coupon_amount: 0.0
          bank_transfer_amount: 0.0
          gift_card_amount: 0.0
          amount: 50.0
          calculated_total: 50.0
          amounts_match: true

        - order_id: 3
          credit_card_amount: 25.0
          coupon_amount: 10.0
          bank_transfer_amount: 0.0
          gift_card_amount: 5.0
          amount: 45.0
          calculated_total: 40.0
          amounts_match: false

        - order_id: 4
          credit_card_amount: 10.33
          coupon_amount: 10.33
          bank_transfer_amount: 10.33
          gift_card_amount: 0.0
          amount: 31.0
          calculated_total: 30.99
          amounts_match: true

        - order_id: 5
          credit_card_amount: 0.0
          coupon_amount: 0.0
          bank_transfer_amount: 0.0
          gift_card_amount: 0.0
          amount: 0.0
          calculated_total: 0.0
          amounts_match: true

test_stg_payments_transforms:
  model: staging.stg_payments
  description: "Ensures raw payments transform correctly: cents-to-dollars conversion and discounted flag set only for coupon, including zero-amount and multiple-method scenarios."
  inputs:
    raw.raw_payments:
      rows:
        - id: 1
          order_id: 1
          payment_method: credit_card
          amount: 1000

        - id: 3
          order_id: 3
          payment_method: coupon
          amount: 100

        - id: 77
          order_id: 67
          payment_method: credit_card
          amount: 1900

        - id: 87
          order_id: 77
          payment_method: credit_card
          amount: 0

        - id: 88
          order_id: 77
          payment_method: bank_transfer
          amount: 1900
  outputs:
    query:
      rows:
        - payment_id: 1
          order_id: 1
          payment_method: credit_card
          amount: 10.0
          discounted: 'false'

        - payment_id: 3
          order_id: 3
          payment_method: coupon
          amount: 1.0
          discounted: 'true'

        - payment_id: 77
          order_id: 67
          payment_method: credit_card
          amount: 19.0
          discounted: 'false'

        - payment_id: 87
          order_id: 77
          payment_method: credit_card
          amount: 0.0
          discounted: 'false'

        - payment_id: 88
          order_id: 77
          payment_method: bank_transfer
          amount: 19.0
          discounted: 'false'

